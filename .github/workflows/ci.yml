name: CI

# Filet de sécurité (Priorité 1) : tests d'API de bout en bout, audit des
# dépendances de production, et recherche de secrets. Ces contrôles doivent
# rester verts avant et après chaque PR de découpage.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: Tests d'API (bout en bout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Suite d'API
        run: npm run test:api

  typecheck:
    name: Vérification de types (checkJs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Vérifie les modules serveur extraits (server/lib), sans compilation
      # (Node exécute les .mjs tels quels). Périmètre élargi au fil du découpage.
      - name: Types des modules serveur
        run: npm run typecheck

  e2e:
    name: Tests end-to-end (navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Chromium seul (les scenarios n'ont pas besoin des autres navigateurs).
      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium
      # Compile le frontend puis pilote l'interface reelle contre une instance
      # serveur isolee (base SQLite temporaire, jamais les donnees de dev).
      - name: Scenarios end-to-end
        run: npm run test:e2e
      - name: Publier le rapport en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Bloque la construction sur toute vulnérabilité CRITIQUE d'une dépendance
      # de production (le runtime servant les données de santé). Seuil à resserrer
      # vers "high" une fois les vulnérabilités hautes transitives triées.
      - name: Audit production (bloque sur critique)
        run: npm audit --omit=dev --audit-level=critical
      # Vue complète, informative, ne bloque pas (bruit de l'outillage de dev).
      - name: Audit complet (informatif)
        run: npm audit || true

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scanner l'arborescence (échoue si un secret est trouvé)
        run: ./gitleaks dir . --redact --no-banner --exit-code 1
