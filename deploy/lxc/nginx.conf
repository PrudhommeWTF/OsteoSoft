# OsteoSoft — reverse proxy nginx OPTIONNEL (pour TLS uniquement).
#
# En mono-service, l'API Node sert déjà le frontend ET /api sur __API_PORT__ :
# nginx n'est PAS nécessaire. Ce fichier ne sert que si vous voulez terminer TLS
# devant l'application (hors LAN de confiance).
#
# Installation :
#   cp deploy/lxc/nginx.conf /etc/nginx/sites-available/osteosoft
#   sed -i "s/__DOMAIN__/votre-domaine/; s/__API_PORT__/4199/" /etc/nginx/sites-available/osteosoft
#   ln -sf /etc/nginx/sites-available/osteosoft /etc/nginx/sites-enabled/osteosoft
#   rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx
#   certbot --nginx -d votre-domaine
# Puis dans /opt/osteosoft/.env : TRUST_PROXY=true et CLIENT_ORIGIN=https://votre-domaine
#   systemctl restart osteosoft-api

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Couvre imports / restaurations / documents (API_LARGE_BODY_LIMIT, défaut 60mb).
    client_max_body_size 60m;

    # Tout (frontend + /api) est servi par l'API Node en mono-service.
    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
