# OsteoSoft — nginx : sert le build Angular statique et proxifie l'API.
# Installé par deploy/lxc/install.sh dans /etc/nginx/sites-available/osteosoft.
# TLS : `certbot --nginx -d votre-domaine` réécrit ce fichier pour ajouter le 443.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/dist/OsteoSoft/browser;
    index index.html;

    # Doit couvrir les imports / restaurations / documents (API_LARGE_BODY_LIMIT, défaut 60mb).
    client_max_body_size 60m;

    # Assets hachés par Angular → cache long. index.html reste non mis en cache.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API Node.js.
    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA Angular : toute autre route retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
