<main class="login-screen d-flex align-items-center justify-content-center" aria-labelledby="login-title">
  <section class="login-card card shadow-lg border-0" role="region" aria-describedby="login-hint">
    <div class="card-body p-4 p-lg-5">
      <div class="text-center mb-4">
        <div class="brand-badge mx-auto mb-3">
          <i class="fa-solid fa-calendar-days"></i>
        </div>
        <h1 id="login-title" class="h3 mb-2">Connexion</h1>
        <p id="login-hint" class="text-secondary mb-0">{{ configService.getAppName() }} v{{ configService.getVersion() }}</p>
      </div>

      <form class="d-grid gap-3" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div>
          <label class="form-label" for="username">Login</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input
              id="username"
              type="text"
              class="form-control"
              formControlName="username"
              autocomplete="username"
              [class.is-invalid]="form.controls.username.invalid && form.controls.username.touched"
            />
          </div>
        </div>

        <div>
          <label class="form-label" for="password">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input
              id="password"
              type="password"
              class="form-control"
              formControlName="password"
              autocomplete="current-password"
              [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
            />
          </div>
        </div>

        <div class="form-check">
          <input id="remember" class="form-check-input" type="checkbox" formControlName="remember" />
          <label class="form-check-label" for="remember">Se souvenir de moi</label>
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2 mb-0" role="alert">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isSubmitting()">
          <i class="fa-solid fa-right-to-bracket me-2"></i>
          @if (isSubmitting()) {
            Connexion...
          } @else {
            Connexion
          }
        </button>
      </form>

      <p class="license text-center text-secondary small mt-4 mb-0">© {{ configService.getAppName() }} v{{ configService.getVersion() }}</p>
    </div>
  </section>
</main>
