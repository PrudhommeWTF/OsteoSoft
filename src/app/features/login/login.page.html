<main class="login-screen" aria-labelledby="login-title">

  <!-- Brand header (above card) -->
  <div class="login-brand">
    <div class="login-logo" aria-hidden="true">
      <i class="fa-solid fa-spa"></i>
    </div>
    <h1 class="login-app-name">OsteoSoft</h1>
    <p class="login-app-sub">Gestion de cabinet d'ostéopathie</p>
  </div>

  <!-- Form card -->
  <section class="login-card">
    <h2 id="login-title" class="login-card-title">Connexion</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="login-form">

      <div class="lf-field">
        <label class="lf-label" for="username">Identifiant</label>
        <input
          id="username"
          type="text"
          class="lf-input"
          [class.lf-input-error]="form.controls.username.invalid && form.controls.username.touched"
          formControlName="username"
          autocomplete="username"
          placeholder="admin"
        />
      </div>

      <div class="lf-field">
        <label class="lf-label" for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          class="lf-input"
          [class.lf-input-error]="form.controls.password.invalid && form.controls.password.touched"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </div>

      <label class="lf-check">
        <input type="checkbox" formControlName="remember" />
        <span>Rester connecté·e</span>
      </label>

      @if (errorMessage()) {
        <div class="lf-error" role="alert">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="lf-submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
          Connexion…
        } @else {
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          Se connecter
        }
      </button>

      <p class="lf-forgot">Mot de passe oublié ?</p>
    </form>
  </section>

  <!-- Setup link -->
  <p class="login-setup-link">
    Première utilisation ?
    <a href="/installation" class="login-setup-btn">Lancer l'installation</a>
  </p>

  <p class="login-meta">{{ configService.getAppName() }} v{{ configService.getVersion() }}</p>
</main>
